name: Build NearCall and NearChat APKs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build both apps
        run: gradle assembleNearcallRelease assembleNearchatRelease --no-daemon

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/nearcall/release/app-nearcall-release.apk NearCall.apk
          cp app/build/outputs/apk/nearchat/release/app-nearchat-release.apk NearChat.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            NearCall.apk
            NearChat.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            NearCall.apk
            NearChat.apk
