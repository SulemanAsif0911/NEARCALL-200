<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NearChat</title>
<meta name="theme-color" content="#000000">
<script>
window.CH_setInsets = function(t,r,b,l){
  var st=document.documentElement.style, a=[t,r,b,l], k=['top','right','bottom','left'];
  for(var i=0;i<4;i++) st.setProperty('--safe-'+k[i], (a[i]||0)+'px');
};
try{ if(window.AndroidNative && AndroidNative.getInsets){ var v=String(AndroidNative.getInsets()||'').split(',').map(Number); window.CH_setInsets(v[0],v[1],v[2],v[3]); } }catch(e){}
</script>
<style>
:root{--bg:#000;--fg:#39ff7a;--dim:#1f9a4d;--line:#0d3b1f;--me:#c8ffd9;--warn:#ffcc33;--bad:#ff5c5c;--panel:#040d07;--safe-top:0px;--safe-bottom:0px;--safe-left:0px;--safe-right:0px}
:root[data-theme="amber"]{--fg:#ffb000;--dim:#a67400;--line:#3a2800;--me:#ffe3a0;--panel:#100a00}
:root[data-theme="light"]{--bg:#fbfdfb;--fg:#0a6b2e;--dim:#5a8f6b;--line:#cfe6d6;--me:#003d17;--panel:#f0f7f2;--warn:#a06b00;--bad:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
button,input{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
header{flex:none;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-top)) calc(12px + var(--safe-right)) 8px calc(12px + var(--safe-left));border-bottom:1px solid var(--line)}
#logo{font-weight:800;font-size:17px;letter-spacing:1px;cursor:pointer;-webkit-user-select:none;user-select:none}
#me{flex:1;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:4px 9px;cursor:pointer}
.hb b{color:var(--me)}
#rooms{flex:none;display:flex;gap:6px;overflow-x:auto;padding:6px calc(12px + var(--safe-right)) 6px calc(12px + var(--safe-left));border-bottom:1px solid var(--line);scrollbar-width:none}
#rooms::-webkit-scrollbar{display:none}
.rm{flex:none;background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.rm.on{color:var(--bg);background:var(--fg);border-color:var(--fg)}
.rm i{font-style:normal;color:var(--warn);margin-left:5px}
.rm.on i{color:var(--bg)}
#log{flex:1;overflow-y:auto;padding:8px calc(12px + var(--safe-right)) 8px calc(12px + var(--safe-left));-webkit-overflow-scrolling:touch}
.ln{word-wrap:break-word;overflow-wrap:anywhere;margin:1px 0;-webkit-user-select:text;user-select:text}
.ln .t{color:var(--dim);font-size:11px}
.ln .who{color:var(--fg);font-weight:700}
.ln .who i{font-style:normal;color:var(--dim);font-weight:400}
.ln.me .who,.ln.me .tx{color:var(--me)}
.ln.sys{color:var(--dim);font-style:italic}
.ln.at{background:rgba(255,204,51,.14);border-left:3px solid var(--warn);padding-left:6px}
.ln .meta{color:var(--dim);font-size:11px}
.ln .bad{color:var(--warn)}
footer{flex:none;border-top:1px solid var(--line);padding:8px calc(10px + var(--safe-right)) calc(8px + var(--safe-bottom)) calc(10px + var(--safe-left));display:flex;gap:8px;align-items:center}
#inp{flex:1;background:none;border:1px solid var(--line);border-radius:6px;padding:9px 10px;outline:none;color:var(--fg);caret-color:var(--fg)}
#inp:focus{border-color:var(--fg)}
#go{background:var(--fg);color:var(--bg);border:0;border-radius:6px;padding:9px 14px;font-weight:800;cursor:pointer}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);background:var(--panel);border-left:1px solid var(--line);z-index:30;transform:translateX(105%);transition:transform .18s;overflow-y:auto;padding:calc(12px + var(--safe-top)) 12px calc(12px + var(--safe-bottom))}
#panel.on{transform:none}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}
#shade.on{display:block}
#panel h3{margin:14px 0 6px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.pr{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.pr .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .n i{font-style:normal;color:var(--dim)}
.pr .s{color:var(--dim);font-size:11px}
.pr .st{color:var(--warn);cursor:pointer;padding:0 4px}
.hint{color:var(--dim);font-size:12px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;width:100%;max-width:560px;margin:0 auto;padding:16px 14px calc(16px + var(--safe-bottom));max-height:88vh;overflow-y:auto}
.sheet h2{margin:0 0 8px;font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.btn{background:none;border:1px solid var(--fg);color:var(--fg);border-radius:6px;padding:8px 12px;cursor:pointer;margin:4px 6px 4px 0}
.btn.f{background:var(--fg);color:var(--bg);font-weight:800}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.in input[type=text]{width:100%;background:none;border:1px solid var(--line);border-radius:6px;padding:9px;color:var(--fg);outline:none;margin:6px 0}
.sw{appearance:none;-webkit-appearance:none;width:42px;height:22px;border:1px solid var(--dim);border-radius:11px;position:relative;outline:none;flex:none;background:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:.15s}
.sw:checked{border-color:var(--fg)}
.sw:checked::after{left:22px;background:var(--fg)}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:88%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="logo">nearchat</span>
    <span id="me"></span>
    <button class="hb" id="peersBtn">people <b id="pc">0</b></button>
    <button class="hb" id="menuBtn">⋮</button>
  </header>
  <div id="rooms"></div>
  <main id="log"></main>
  <footer>
    <input id="inp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="message, or /help">
    <button id="go">send</button>
  </footer>
</div>
<div id="shade"></div>
<aside id="panel"></aside>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
